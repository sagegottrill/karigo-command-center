name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (lockfile-pinned)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency audit (report, non-blocking)
        run: npm audit --omit=dev || true

      - name: Build
        run: npm run build
